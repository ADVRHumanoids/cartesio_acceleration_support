solver_options:
    regularization: 1e-2
    back_end: "qpoases"
    
stack:
    - ["l_sole", "r_sole"]
    - ["l_hand", "com", torso]
    - ["postural", "LeftWrench", "RightWrench"]

constraints:
    - "UnderactuatedDyn"
    - "LeftFc"
    - "RightFc"
    - "LeftCoP"
    - "RightCoP"
    - "LeftFlims"
    - "RightFlims"

LeftCoP:
    lib_name: libcartesio_acceleration_support.so
    type: "CoP"
    link: "l_sole"
    x_limits: [-0.05, 0.1]
    y_limits: [-0.05, 0.05]

RightCoP:
    lib_name: libcartesio_acceleration_support.so
    type: "CoP"
    link: "r_sole"
    x_limits: [-0.05, 0.1]
    y_limits: [-0.05, 0.05]

RightWrench:
    lib_name: libcartesio_acceleration_support.so
    type: "Force"
    link: "r_sole"
    weight: [1, 1, 1, 1, 1, 1]

LeftWrench:
    lib_name: libcartesio_acceleration_support.so
    type: "Force"
    link: "l_sole"
    weight: [1, 1, 1, 1, 1, 1]

RightFc:
    lib_name: libcartesio_acceleration_support.so
    type: "FrictionCone"
    link: "r_sole"
    local: true

LeftFc:
    lib_name: libcartesio_acceleration_support.so
    type: "FrictionCone"
    link: "l_sole"
    local: true

RightFlims:
    lib_name: libcartesio_acceleration_support.so
    type: "ForceLimits"
    link: "r_sole"
    min: [-1000, -1000, -1000, -100, -100, -100]
    max: [1000, 1000, 1000,  100, 100, 100]

LeftFlims:
    lib_name: libcartesio_acceleration_support.so
    type: "ForceLimits"
    link: "l_sole"
    min: [-1000, -1000, -1000, -100, -100, -100]
    max: [1000, 1000, 1000, 100, 100, 100]

UnderactuatedDyn:
    lib_name: libcartesio_acceleration_support.so
    type: "DynamicFeasibility"
    contacts: ["l_sole", "r_sole"]
    dynamics: true

l_sole:
    lib_name: libcartesio_acceleration_support.so
    type: "Cartesian"
    lambda: 0.1
    distal_link: "l_sole"

r_sole:
    lib_name: libcartesio_acceleration_support.so
    type: "Cartesian"
    lambda: 0.1
    distal_link: "r_sole"
    
torso:
    lib_name: libcartesio_acceleration_support.so
    type: "Cartesian"
    lambda: 0.1
    distal_link: "torso"
    indices: [3,4,5]
    
l_hand:
    lib_name: libcartesio_acceleration_support.so
    type: "Cartesian"
    lambda: 0.1
    distal_link: "LSoftHand"

postural:
    lib_name: libcartesio_acceleration_support.so
    type: "Postural"
    lambda: 0.1
    
com:
    lib_name: libcartesio_acceleration_support.so
    type: "Com"
    lambda: 0.1




